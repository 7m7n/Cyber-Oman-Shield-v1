<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cyber OMAN Shield 2040 v1</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <div class="popup">
    <div class="row"><strong id="subject">(No email detected)</strong></div>
    <div class="row">Score: <strong id="score">—</strong></div>
    <div class="row small" id="explain">Open a message thread in Gmail to see analysis.</div>
    <div class="row">
      <button id="report" class="button">Report Phishing</button>
      <a id="options" class="button" href="#">Settings</a>
    </div>
    <div class="row small"><a href="https://support.google.com/mail/answer/8253" target="_blank">How to report phishing in Gmail</a></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
